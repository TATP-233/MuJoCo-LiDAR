name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python 3.12 --extra dev
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .

  test-cpu:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python 3.12 --extra dev
      - run: uv run python -m pytest tests/test_core.py tests/test_cpu_backend.py tests/test_scan_gen.py -v

  test-backends:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python 3.12 --extra taichi --extra jax --extra dev
      - run: uv run python -m pytest tests/test_integration.py -v
